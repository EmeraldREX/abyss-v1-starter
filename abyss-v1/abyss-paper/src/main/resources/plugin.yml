name: AbyssDungeon
version: '0.6.0'
main: dev.abyss.AbyssPlugin
api-version: '26.2'
author: AbyssDungeon
softdepend: [WorldEdit]
commands:
  abyss:
    description: Abyss Dungeon management
    usage: /abyss <start|bag|warehouse|menu|guide|growth|magic|skills|cast|class|retreat>
permissions:
  abyss.admin:
    default: op
  abyss.test:
    description: Testing commands; OP status alone does not grant access
    default: false
depend:
  - WorldEdit